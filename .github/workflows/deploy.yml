name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Use Node.js 24 for JS-based actions (checkout, setup-node, etc.); Node 20 is deprecated on runners.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set base path
        id: base_path
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "base_path=/" >> $GITHUB_OUTPUT
          else
            echo "base_path=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.base_path }}
        run: npm run build

      - name: Verify .nojekyll exists in dist
        run: |
          if [ -f dist/.nojekyll ]; then
            echo "✅ .nojekyll found in dist/"
          else
            echo "⚠️ .nojekyll not found, creating it..."
            touch dist/.nojekyll
            echo "✅ Created .nojekyll in dist/"
          fi

      - name: Check dist size (GitHub Pages artifact limit ~1 GiB)
        run: |
          SIZE=$(du -sb dist | cut -f1)
          LIMIT=$((1024 * 1024 * 1024))
          echo "dist/ size: $(du -sh dist | cut -f1) ($SIZE bytes)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::dist/ is larger than the ~1 GiB limit for GitHub Pages deployment artifacts. Compress images/videos in src/assets, drop unused files, or deploy the site on Vercel/Netlify (higher limits)."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # No floating @v5 tag on this action — use v5.0.0 (see actions/upload-pages-artifact tags).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
