# Deploys by pushing dist/ to branch `gh-pages` (no 1 GiB Actions artifact limit).
# In the repo: Settings → Pages → Build and deployment → Source: Deploy from a branch → Branch: gh-pages, folder: / (root).
# If it still says "GitHub Actions", switch to the branch source above.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Use Node.js 24 for JS-based actions; Node 20 is deprecated on runners.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set base path
        id: base_path
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "base_path=/" >> $GITHUB_OUTPUT
          else
            echo "base_path=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.base_path }}
        run: npm run build

      - name: Verify .nojekyll exists in dist
        run: |
          if [ ! -f dist/.nojekyll ]; then
            touch dist/.nojekyll
          fi

      - name: Dist size (info)
        run: du -sh dist

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
